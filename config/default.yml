model:
  maximum_dimension_mm: 250.0
  base_thickness_mm: 3.0
  vertical_exaggeration: 1.0
  # Smaller values produce finer-resolution terrain and feature masks, at the cost of slower builds.
  grid_spacing_mm: 0.25
  # Thickness of the top shell layer that represents exposed rock/snow above the core terrain.
  material_cap_depth_mm: 0.60

layers:
  forest: forest
  road_areas: road-areas
  roads: roads
  ski_runs: ski-runs
  lifts: lifts

features:
  road_name_field: name
  run_difficulty_field: difficulty
  # Every distinct value in this field becomes its own output object.
  # Null, blank or whitespace-only values use this label.
  blank_difficulty_label: Unclassified
  roads:
    extrusions: 2
    height_mm: 0.40
  runs:
    extrusions: 1
    height_mm: 0.20
  lifts:
    extrusions: 1
    height_mm: 0.20

rock:
  slope_center_degrees: 42.75
  slope_span_degrees: 13.25
  roughness_sigma_cells: 1.2
  roughness_normalization_percentile: 95.0
  roughness_weight: 0.575
  score_threshold: 0.65
  closing_iterations: 1
  opening_iterations: 1
  minimum_patch_area_mm2: 1.5

output:
  write_stl_parts: true
  diagnostic_previews: false
