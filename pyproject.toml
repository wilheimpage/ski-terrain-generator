[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ski-terrain-generator"
version = "1.0.0"
description = "Generate printer-aware multi-colour 3MF terrain models from a DEM and QGIS GeoPackage"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "rasterio>=1.3", "geopandas>=0.14",
  "shapely>=2.0", "trimesh>=4.0", "matplotlib>=3.8", "PyYAML>=6.0", "pyogrio>=0.7"
]

[project.scripts]
ski-terrain = "ski_terrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
